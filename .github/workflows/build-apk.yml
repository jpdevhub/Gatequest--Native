name: Android APK

# Fires ONLY when you push a version tag  (e.g. git tag v1.2.3 && git push --tags)
# A lightweight lint/type-check job still runs on every PR so you catch issues early.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# ── 1. Verify (runs on every PR — fast, no Android toolchain needed) ──────────
jobs:
  verify:
    name: Type-check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npm run type-check

      - run: npm run lint

# ── 2. Build (runs only when a version tag triggers the workflow) ─────────────
  build:
    name: Build & sign APK
    # Skip the full build on PRs — verify is enough there.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPPORT_WHATSAPP: ${{ secrets.EXPO_PUBLIC_SUPPORT_WHATSAPP }}
      EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME }}
      # Speed up Gradle
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -XX:+HeapDumpOnOutOfMemoryError -Xmx4g -XX:MaxMetaspaceSize=512m"

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'   # temurin is faster to download than zulu

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Write .env
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            echo "EXPO_PUBLIC_SUPPORT_WHATSAPP=${EXPO_PUBLIC_SUPPORT_WHATSAPP}"
            echo "EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME=${EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME}"
          } > .env

      - name: Fail fast on missing Supabase config
        run: |
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL}" ] || [ -z "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set as repository secrets."
            exit 1
          fi

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Cache Gradle after prebuild so the wrapper and generated files are included
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cache the React Native / Metro bundler output
      - name: Restore Metro cache
        uses: actions/cache@v4
        with:
          path: ~/.metro-cache
          key: ${{ runner.os }}-metro-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-metro-

      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew assembleDebug --build-cache --no-daemon --parallel
        working-directory: android

      - name: Upload debug APK
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gatequest-debug-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease --build-cache --no-daemon --parallel
        working-directory: android

      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gatequest-${{ github.ref_name }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 90
